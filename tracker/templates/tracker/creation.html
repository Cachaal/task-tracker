{% extends "tracker/layout.html" %}
{% load static %}


{% block body %}
<div class="container d-flex justify-content-center">
    <h1>CREATION</h1>
</div>

<div id="error-message"></div>
<div id="message"></div>
<div id="content"></div>
<div id="extra-content"></div>
<div class="form-container">
    <form class="d-flex flex-wrap" id="task-form">
        {% csrf_token %}
        {{ task_form }}
        <button type="submit" class="add-button btn"> Add </button>
    </form>
</div>

<div id="toast-container" class="toast-container p-3 bottom-0 end-0">
    <div class="toast align-items-center border-0" id="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toast-content">
            
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

{% endblock %}
{% block script %}
<script src="{% static 'tracker/creation.js' %}"></script>
{% endblock %}
