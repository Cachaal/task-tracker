{% extends "tracker/layout.html" %}
{% load static %}

{% block body %}
<div class="container d-flex justify-content-center">
    <h1>SUMMARY</h1>
</div>
{% csrf_token %}
<div class="d-flex justify-content-center">
    

    <div id="dropdown-search">
        <div id="calendar-mode" >
            <select name="mode" id="mode-dropdown" class="dropdown dropdown-summary misc-dropdown">
                <option value="month" selected> Monthly </option>
                <option value="week">Weekly</option>
            </select>
        </div>
        <div id="category-search" >
            <select name="category" id="category-dropdown" class="dropdown dropdown-summary misc-dropdown">
                <option value="OVERALL" selected>Overall</option>
                <option value="HYGI">Hygiene</option>
                <option value="SELF">Self-Care</option>
                <option value="GOAL">Goal-Progress</option>
                <option value="MISC">MISCELANEOUS</option>
            </select>
        </div>
    </div> 

</div>
    <div id="summary" class="tempus-container">

        <div class="input-group d-none d-md-block d-lg=block d-xl-block" id="datetimepicker1" data-td-target-input="nearest">
            <input id="date-input" hidden type="text" class="form-control" data-td-target="#datetimepicker1"/>
        </div>
        <div id="error-message"></div>
        <div id="message"></div>
        <div id="chart">
            <canvas id="myChart"></canvas>
        </div>
        
    </div>
    <div id="mobile-elements" class="d-flex d-md-none d-lg-none d-xl-none justify-content-center mx-auto">
        <div>
            <div class="d-flex justify-content-center"> Select a date:</div>
            <input id="mobile-calendar" type="date">
        </div>
    </div>
    

<div id="extra-content"></div>


{% endblock %}
{% block script %}
        <script src="{% static 'tracker/summary.js' %}"></script>
{% endblock %}
