{% extends "tracker/layout.html" %}
{% load static %}

{% block body %}
<div class="container d-flex justify-content-center">
    <h1>HISTORY</h1>
</div>

{% csrf_token %}

    <div id="toast-container" class="toast-container p-3 top-50 end-0">
        <div class="toast align-items-center border-0" id="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toast-content">
                
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>




    <div class="tempus-container d-flex justify-content-center">
        <div class="input-group d-none d-md-block d-lg-block d-xl-block" id="datetimepicker2" data-td-target-input="nearest">
                <input id="date-input" hidden type="text" class="form-control" data-td-target="#datetimepicker2"/>
        </div>
    </div>

    <div id="mobile-elements" class="d-flex d-md-none d-lg-none d-xl-none justify-content-center mx-auto">
        <div>
            <div class="d-flex justify-content-center"> Select a date:</div>
            <input id="mobile-calendar" type="date">
        </div>
    </div>

    <div id="content"></div>





<div id="error-message"></div>
<div id="message"></div>
<div id="content"></div>
<div id="extra-content"></div>


{% endblock %}
{% block script %}
    <script src="{% static 'tracker/history.js' %}"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function(){
                new tempusDominus.TempusDominus(document.getElementById('datetimepicker2'),
                {
                    display: {
                        inline: true,
                        keepOpen: true,
                        viewMode:'calendar',
                        components:{
                            calendar: true,
                            date: true,
                            month: true,
                            year: true,

                            clock: false
                        },
                        buttons: false
                    },
                    useCurrent: true,
                    localization: {
                        dayViewHeaderFormat: {month: 'long', year: 'numeric'},
                        dateFormats: {
                            L: 'yyyy-MM-dd'
                        },
                        format: 'L'
                    },
                })
            })
        </script>
{% endblock %}
